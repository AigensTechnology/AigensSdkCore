name: aigens_sdk_core
description: Flutter plugin for Aigens SDK - enables native iOS/Android apps to embed Aigens universal UX
version: 1.0.0
homepage: https://github.com/AigensTechnology/AigensSdkCore

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aigens.sdk.flutter
        dartPluginClass: AigensSdkCore
        pluginClass: AigensSdkCorePlugin 
      ios:
        dartPluginClass: AigensSdkCore
        # Flutter 插件入口类（SPM 和 CocoaPods 都需要）
        pluginClass: AigensSdkCorePlugin
        
        # Flutter 3.16+ SPM 支持
        # 指定 SPM 包名称（对应 Package.swift 中的 name）
        package: aigens_sdk_core

