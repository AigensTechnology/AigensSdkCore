name: aigens_sdk_core
description: Flutter plugin for Aigens SDK - enables native iOS/Android apps to embed Aigens universal UX
version: 0.1.4
homepage: https://github.com/AigensTechnology/AigensSdkCore

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aigens.sdk.flutter
        pluginClass: AigensSdkCorePlugin 
      ios:
        # SPM 和 CocoaPods（兼容旧版本）
        # pluginClass: AigensSdkCorePlugin

        # spm
        package: aigens_sdk_core

        # Flutter 3.16+ 支持 SPM
        # 使用 SPM 时，需要指定 package 名称（对应 Package.swift 中的 name）
        # 并删除或保留 podspec 文件（建议保留以兼容旧版本）
        # package: aigens_sdk_core

